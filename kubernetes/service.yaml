apiVersion: v1
kind: Service
metadata:
  name: bookstore-frontend-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-045aca26a26447f0a,subnet-01cf4111b909d1c15
spec:
  type: LoadBalancer
  selector:
    app: bookstore-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-backend-service
spec:
  type: ClusterIP
  selector:
    app: bookstore-backend
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
