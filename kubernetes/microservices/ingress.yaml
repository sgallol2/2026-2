apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore-microservices-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          # Microservicio de Autenticación
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001

          # Microservicio de Catálogo de Libros (+ Endpoints de Saga)
          - path: /api/v1/books
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 5002

          # Microservicio de Órdenes (Orquestador de Saga)
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  number: 5003

          # Microservicio de Analítica (Sidecar Fluent Bit)
          - path: /api/v1/events
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 5004

          # Frontend SPA (si corre en el clúster o redirigido a CloudFront)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookstore-frontend-service
                port:
                  number: 80

