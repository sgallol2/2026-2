apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-fluent-bit-config
  labels:
    app: analytics-service
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               clickstream.*
        Path              /usr/src/app/logs/clickstream.log
        Parser            json
        DB                /usr/src/app/logs/fluent-bit.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  1

    [OUTPUT]
        Name              kinesis_firehose
        Match             clickstream.*
        region            us-east-1
        delivery_stream   bookstore-clickstream-stream
  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: fluent-bit-config-volume
          configMap:
            name: analytics-fluent-bit-config
      containers:
        - name: analytics-service
          image: 683090163663.dkr.ecr.us-east-1.amazonaws.com/bookstore-analytics-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/logs
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5004"
            - name: SERVICE_NAME
              value: "analytics-service"
            - name: API_BASE_PATH
              value: "/api/v1"
            - name: CLICKSTREAM_FILE_ENABLED
              value: "true"
            - name: CLICKSTREAM_FILE_PATH
              value: "/usr/src/app/logs/clickstream.log"
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

        # Contenedor Sidecar: Fluent Bit transmitiendo a Amazon Kinesis Firehose
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/logs
            - name: fluent-bit-config-volume
              mountPath: /fluent-bit/etc/
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  ports:
    - port: 5004
      targetPort: 5004
      protocol: TCP
      name: http
  selector:
    app: analytics-service

