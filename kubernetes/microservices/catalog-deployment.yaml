apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: 683090163663.dkr.ecr.us-east-1.amazonaws.com/bookstore-catalog-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5002"
            - name: SERVICE_NAME
              value: "catalog-service"
            - name: API_BASE_PATH
              value: "/api/v1"
            - name: DB_HOST
              value: "bookstore-db.chyea5r4ut1k.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "bookstore"
            - name: APP_DB_USER
              value: "bookstore_app"
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstore-db-secret
                  key: password
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP
      name: http
  selector:
    app: catalog-service

