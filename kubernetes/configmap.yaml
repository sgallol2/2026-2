apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-config
  labels:
    app: bookstore-backend
data:
  SERVICE_NAME: "bookstore-api"
  PORT: "5001"
  NODE_ENV: "production"
  API_BASE_PATH: "/api"

  # Base de Datos (Amazon RDS)
  DB_HOST: "bookstore-db.ceuzfwveolu9.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "bookstore"
  DB_USER: "bookstore_app"
  DB_SSL: "true"
  DB_SSL_REJECT_UNAUTHORIZED: "false"
  DB_POOL_MAX: "10"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECTION_TIMEOUT_MS: "5000"

  # Configuración de CORS (Orígenes permitidos separados por coma)
  # Incluye el balanceador LoadBalancer/ALB, CloudFront o localhost para desarrollo
  CORS_ORIGINS: "http://a07e12f7203a240599e8d71cc85ff72d-1ec1f6a1e3999203.elb.us-east-1.amazonaws.com,http://localhost:3000"

  # Configuración y Límites de la Aplicación
  ORDERS_MAX_DISTINCT_ITEMS: "100"
  ORDERS_MAX_QUANTITY_PER_ITEM: "1000"
  BOOKS_DEFAULT_LIMIT: "24"
  BOOKS_MAX_LIMIT: "100"
  HTTP_TRUST_PROXY_HOPS: "1"
  HTTP_JSON_BODY_LIMIT: "32kb"

  # JWT y Cookies de Sesión
  AUTH_JWT_ALGORITHM: "HS256"
  AUTH_JWT_ISSUER: "bookstore-api"
  AUTH_JWT_AUDIENCE: "bookstore-web"
  AUTH_TOKEN_TTL_SECONDS: "28800"
  AUTH_COOKIE_NAME: "bookstore_session"
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAME_SITE: "lax"
  AUTH_COOKIE_PATH: "/api"

  # Telemetría, Logs y Clickstream
  CLICKSTREAM_FILE_ENABLED: "true"
  CLICKSTREAM_FILE_PATH: "/usr/src/app/logs/clickstream.log"
  ACCESS_LOG_ENABLED: "true"
  ACCESS_LOG_EXCLUDE_PATHS: "/health"
  ACCESS_LOG_MAX_FIELD_LENGTH: "2048"
  ACCESS_LOG_REQUEST_ID_HEADER: "X-Request-Id"

