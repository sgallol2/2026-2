apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    app: bookstore-backend
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               clickstream.*
        Path              /usr/src/app/logs/clickstream.log
        Parser            json
        DB                /usr/src/app/logs/fluent-bit.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  1

    [OUTPUT]
        Name              kinesis_firehose
        Match             clickstream.*
        region            us-east-1
        delivery_stream   bookstore-clickstream-stream
  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
  labels:
    app: bookstore-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookstore-frontend
  template:
    metadata:
      labels:
        app: bookstore-frontend
    spec:
      containers:
        - name: frontend
          image: 683090163663.dkr.ecr.us-east-1.amazonaws.com/bookstore-frontend:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: NGINX_PORT
              value: "80"
            - name: API_PROXY_PREFIX
              value: "/api"
            - name: PROXY_PASS
              value: "http://bookstore-backend-service:5001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-backend
  labels:
    app: bookstore-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookstore-backend
  template:
    metadata:
      labels:
        app: bookstore-backend
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: fluent-bit-config-volume
          configMap:
            name: fluent-bit-config
      containers:
        - name: backend
          image: 683090163663.dkr.ecr.us-east-1.amazonaws.com/bookstore-backend:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/logs
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secrets
        - name: fluent-bit-sidecar
          image: amazon/aws-for-fluent-bit:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/logs
            - name: fluent-bit-config-volume
              mountPath: /fluent-bit/etc/
          resources:
            limits:
              memory: 64Mi
              cpu: 100m
            requests:
              memory: 32Mi
              cpu: 50m
